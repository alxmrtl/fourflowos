<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 2 — Bottom Sheet Drawer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .label {
    color: #666;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: center;
  }

  /* Mobile phone frame */
  .phone {
    width: 390px;
    height: 844px;
    background: #050505;
    border-radius: 48px;
    border: 1px solid #2a2a2a;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* Status bar */
  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    flex-shrink: 0;
  }
  .status-bar .time { color: #fff; font-size: 15px; font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  /* Scrollable section content */
  .section {
    padding: 40px 20px 0;
    position: relative;
    overflow: hidden;
  }

  .section::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, #E84535 0%, transparent 30%),
      radial-gradient(circle at 80% 30%, #4E8C73 0%, transparent 30%),
      radial-gradient(circle at 30% 80%, #3E6FA3 0%, transparent 30%),
      radial-gradient(circle at 70% 70%, #6330A0 0%, transparent 30%);
    opacity: 0.03;
    pointer-events: none;
  }

  .section-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .section-header h2 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 400;
    color: #fff;
    line-height: 1.2;
  }

  .section-header h2 em {
    font-style: italic;
    background: linear-gradient(90deg, #E84535 0%, #c75c32 20%, #4E8C73 45%, #3E6FA3 70%, #6330A0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Card strip stack */
  .cards-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Compact horizontal card */
  .strip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    border-radius: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .strip:active { transform: scale(0.98); }

  /* Active state — brighter border + tinted bg */
  .strip.active {
    border-color: var(--color-mid) !important;
    background: var(--color-bg-active) !important;
  }

  /* Animated shimmer on active */
  .strip.active::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--color-shimmer) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: shimmer 0.5s ease forwards;
    pointer-events: none;
  }

  @keyframes shimmer {
    to { transform: translateX(100%); }
  }

  .strip-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background 0.25s ease;
  }

  .strip-icon svg {
    width: 26px;
    height: 26px;
  }

  .strip-icon-glow {
    position: absolute;
    inset: -4px;
    border-radius: 16px;
    filter: blur(8px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .strip.active .strip-icon-glow { opacity: 0.4; }

  .strip-text {
    flex: 1;
    min-width: 0;
  }

  .strip-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 3px;
  }

  .strip-tagline {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .strip-indicator {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
    align-items: center;
  }

  .indicator-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    opacity: 0.4;
    transition: opacity 0.25s ease;
  }

  .strip.active .indicator-dot { opacity: 1; }

  .strip-chevron {
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    margin-left: 4px;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .strip.active .strip-chevron {
    color: rgba(255,255,255,0.7);
    transform: rotate(90deg);
  }

  /* Principle bridge */
  .bridge {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bridge-line {
    flex: 1;
    height: 1px;
  }

  .bridge p {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    font-style: italic;
    text-align: center;
    white-space: nowrap;
  }

  /* ================================================
     BOTTOM SHEET
  ================================================ */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.35s ease;
    z-index: 10;
  }

  .sheet-backdrop.visible {
    background: rgba(0,0,0,0.45);
    pointer-events: auto;
  }

  .sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f0f0f;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 20;
    padding-bottom: 24px;
    overflow: hidden;
  }

  .sheet.open {
    transform: translateY(0);
  }

  /* Colored accent top edge */
  .sheet-top-accent {
    height: 2px;
    width: 100%;
    transition: background 0.3s ease;
  }

  .sheet-pill-wrap {
    display: flex;
    justify-content: center;
    padding: 10px 0 4px;
  }

  .sheet-pill {
    width: 36px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px 14px;
  }

  .sheet-dim-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .sheet-count {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sheet-count-dots {
    display: flex;
    gap: 3px;
  }

  .sheet-count-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  /* Keys inside sheet */
  .sheet-keys {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sheet-key {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .sheet.open .sheet-key:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.08s; }
  .sheet.open .sheet-key:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.14s; }
  .sheet.open .sheet-key:nth-child(3) { opacity: 1; transform: none; transition-delay: 0.20s; }

  .sheet-key-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sheet-key-icon svg {
    width: 20px;
    height: 20px;
  }

  .sheet-key-text {
    flex: 1;
    min-width: 0;
  }

  .sheet-key-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .sheet-key-desc {
    font-size: 10.5px;
    color: rgba(255,255,255,0.4);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>

  }
};

let currentDim = null;

function selectDim(id) {
  if (currentDim === id) {
    closeSheet();
    return;
  }

  // Deactivate all strips
  document.querySelectorAll('.strip').forEach(s => s.classList.remove('active'));

  // Activate selected
  document.getElementById('strip-' + id).classList.add('active');

  currentDim = id;
  const dim = DATA[id];

  // Update sheet content
  document.getElementById('sheet-title').textContent = dim.name;
  document.getElementById('sheet-title').style.color = dim.color;
  document.getElementById('sheet-accent').style.background =
    `linear-gradient(90deg, ${dim.color}80, ${dim.color}40, transparent)`;

  // Dots
  const dotsEl = document.getElementById('sheet-dots');
  dotsEl.innerHTML = dim.keys.map(() =>
    `<div class="sheet-count-dot" style="background:${dim.color};"></div>`
  ).join('');

  // Keys — rebuild with reset animation
  const keysEl = document.getElementById('sheet-keys');
  keysEl.innerHTML = dim.keys.map(key => `
    <div class="sheet-key">
      <div class="sheet-key-icon" style="background:${dim.color}22;">
        ${key.icon}
      </div>
      <div class="sheet-key-text">
        <div class="sheet-key-name">${key.name}</div>
        <div class="sheet-key-desc">${key.desc}</div>
      </div>
    </div>
  `).join('');

  // Open sheet
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');

  // Force reflow to restart key animations
  sheet.classList.remove('open');
  void sheet.offsetWidth;
  sheet.classList.add('open');
  backdrop.classList.add('visible');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('backdrop').classList.remove('visible');
  document.querySelectorAll('.strip').forEach(s => s.classList.remove('active'));
  currentDim = null;
}
</script>

</body>
</html>
