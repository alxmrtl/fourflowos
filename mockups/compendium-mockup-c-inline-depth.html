<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup C — Inline Depth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --self:    #FF6F61;
  --space:   #6BA292;
  --story:   #5B84B1;
  --spirit:  #7A4DA4;
  --bg:      #F8F7F4;
  --surface: #FFFFFF;
  --text:    #1A1A1A;
  --muted:   #8A8A8A;
  --border:  rgba(0,0,0,0.07);
  --dim:     #D0D0D0;
}

html, body { background: #DDDBD5; font-family: 'Inter', system-ui, sans-serif; }

.mockup-label {
  text-align: center; padding: 20px 0 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(0,0,0,0.35);
}

/* ── Phone shell ── */
.phone-shell {
  width: 390px; min-height: 844px;
  margin: 0 auto 40px;
  background: var(--bg);
  border-radius: 48px;
  box-shadow: 0 28px 80px rgba(0,0,0,0.20), 0 4px 14px rgba(0,0,0,0.08);
  overflow: hidden; position: relative;
}

/* ── Status bar ── */
.status-bar {
  height: 44px; padding: 14px 28px 0;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 600;
  background: var(--bg); position: sticky; top: 0; z-index: 20;
}

/* ── Page header ── */
.page-header {
  padding: 10px 20px 16px;
  display: flex; align-items: baseline; justify-content: space-between;
  background: var(--bg); position: sticky; top: 44px; z-index: 19;
  border-bottom: 1px solid var(--border);
}
.page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.page-sub { font-size: 11px; color: var(--muted); font-weight: 500; }

/* ── Scroll area ── */
.scroll-area { padding: 0 0 100px; overflow-y: auto; max-height: calc(844px - 44px - 48px); }

/* ── Dimension section ── */
.dim-section { margin-top: 0; }
.dim-header {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 20px 12px;
  position: sticky; top: calc(44px + 48px); z-index: 18;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.dim-accent-bar {
  width: 4px; height: 28px; border-radius: 3px; flex-shrink: 0;
}
.dim-emoji { font-size: 20px; flex-shrink: 0; }
.dim-name {
  font-size: 16px; font-weight: 900;
  letter-spacing: 0.12em; text-transform: uppercase;
  font-family: 'Inter', sans-serif;
}
.dim-count { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: auto; }

/* ── State row ── */
.state-row {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}
.state-row-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.state-emoji { font-size: 18px; }
.state-name {
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  flex: 1;
}

/* ── Quality chips row ── */
.quality-chips {
  display: flex; gap: 6px; flex-wrap: nowrap;
}
.q-chip {
  flex: 1; min-width: 0;
  border-radius: 12px;
  padding: 8px 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: flex; flex-direction: column; gap: 4px;
  transition: all 0.16s ease;
  text-align: center; align-items: center;
}
.q-chip.active { border-width: 2px; }
.q-chip-type {
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.q-chip-icon { width: 11px; height: 11px; display: flex; align-items: center; justify-content: center; }
.q-chip-icon svg { width: 11px; height: 11px; display: block; }
.q-chip-type-label {
  font-size: 7px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.q-chip.active .q-chip-type-label { color: rgba(0,0,0,0.5); }
.q-chip-name { font-size: 10px; font-weight: 700; line-height: 1.2; color: #333; }

/* ── Inline expansion panel ── */
.expansion-panel {
  max-height: 0; overflow: hidden;
  transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1);
}
.expansion-panel.open { max-height: 1000px; }
.expansion-inner {
  background: var(--surface);
  border-radius: 16px;
  margin: 8px 0 4px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.ep-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px;
}
.ep-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ep-icon svg { width: 14px; height: 14px; }
.ep-info { flex: 1; }
.ep-type { font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; display: flex; align-items: center; gap: 3px; }
.ep-type svg { width: 9px; height: 9px; }
.ep-name { font-size: 14px; font-weight: 800; line-height: 1.2; }
.ep-def { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

.ep-section-label {
  padding: 8px 14px 4px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 5px;
  border-top: 1px solid var(--border);
}
.ep-section-label svg { width: 10px; height: 10px; }
.ep-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  cursor: pointer; background: none; border: none; width: 100%; text-align: left;
  transition: background 0.12s;
  border-top: 1px solid var(--border);
}
.ep-item:first-of-type { border-top: none; }
.ep-item:hover { background: rgba(0,0,0,0.025); }
.ep-item:active { background: rgba(0,0,0,0.05); }
.ep-item-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ep-item-icon svg { width: 11px; height: 11px; }
.ep-item-name { font-size: 12px; font-weight: 600; flex: 1; color: var(--text); }
.ep-item-arrow { font-size: 11px; color: var(--dim); }

/* ── Bottom sheet ── */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  z-index: 200; display: none; align-items: flex-end;
  backdrop-filter: blur(3px);
}
.sheet-overlay.open { display: flex; }
.bottom-sheet {
  width: 390px; max-height: 72vh;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  overflow: hidden; display: flex; flex-direction: column;
  animation: slideUp 0.26s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--dim); margin: 10px auto 0; flex-shrink: 0; }
.sheet-inner { padding: 14px 20px 36px; overflow-y: auto; flex: 1; }
.sheet-back { font-size: 11px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 3px; margin-bottom: 12px; background: none; border: none; padding: 0; }
.sheet-type-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 10px; }
.sheet-title { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 18px; }
.sheet-section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.sheet-content { font-size: 13px; line-height: 1.6; color: #333; margin-bottom: 20px; }
.sheet-steps { list-style: none; }
.sheet-step { display: flex; gap: 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.5; color: #333; }
.step-num { width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
</style>
</head>

<script>
const ICONS = {

const COLORS = { self: '#FF6F61', space: '#6BA292', story: '#5B84B1', spirit: '#7A4DA4' };
const DIM_EMOJIS = { self: '🔥', space: '🏛️', story: '📖', spirit: '✨' };
const STATE_EMOJIS = { 'tuned-emotions':'🌊','focused-body':'⚡','open-mind':'🔮','intentional-space':'🏛️','optimized-tools':'⚙️','feedback-systems':'📡','generative-story':'✨','clear-mission':'🎯','empowered-role':'🦁','grounding-values':'🌳','ignited-curiosity':'🔥','visualized-vision':'🌅' };

function rgba(p, a) {
  const h = COLORS[p]; const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const DATA = {
  self: { color: '#FF6F61', states: [
    { id: 'tuned-emotions', name: 'Tuned Emotions', qualities: [
      { type: 'restore', name: 'Quiet', def: 'Emotional noise cleared; baseline calm restored.', techniques: ['Pre-Session Clearance','Somatic Release Protocol','Resistance-Desire Clearing'], concepts: ['Window of Tolerance','Polyvagal Theory'] },

      { type: 'concentrate', name: 'Calibrated', def: 'Emotional signal precisely tuned to the task.', techniques: ['Detachment Protocol','Pre-Session Clearance'], concepts: ['Optimal Arousal Theory'] },
    ]},
    { id: 'focused-body', name: 'Focused Body', qualities: [
      { type: 'restore', name: 'Released', def: 'Physical tension dissolved; body returns to neutral.', techniques: ['Action-Awareness Merging','Subconscious Surrender Protocol'], concepts: ['Transient Hypofrontality'] },
      { type: 'maintain', name: 'Grounded', def: 'Stable physical anchor holds attention through distraction.', techniques: ['Progressive Attention Training','Attention Mode Toggle'], concepts: ['Embodied Cognition'] },
      { type: 'concentrate', name: 'Activated', def: 'Body fully engaged; movement and focus merge.', techniques: ['Aperture Absorption','Action-Awareness Merging'], concepts: ['Motor-Cognitive Coupling'] },
    ]},
    { id: 'open-mind', name: 'Open Mind', qualities: [
      { type: 'restore', name: 'Cleared', def: 'Mental chatter stilled; conceptual space reopened.', techniques: ['No-Mind Practice','Beginner Lens Reset'], concepts: ['Default Mode Network'] },
      { type: 'maintain', name: 'Receptive', def: 'Mind stays open as the work unfolds.', techniques: ['Beginner Lens Reset','Beauty Immersion'], concepts: ["Beginner's Mind"] },
      { type: 'concentrate', name: 'Expansive', def: 'Mind stretches to hold complex emergent patterns.', techniques: ['Beauty Immersion','Cognitive Widening Protocol'], concepts: ['Cognitive Flexibility'] },
    ]},
  ]},
  space: { color: '#6BA292', states: [
    { id: 'intentional-space', name: 'Intentional Space', qualities: [
      { type: 'restore', name: 'Cleared', def: 'Environmental friction removed; space reset.', techniques: ['Space Reset Protocol','Threshold Ritual'], concepts: ['Affordance Theory'] },
      { type: 'maintain', name: 'Held', def: 'Space continuously curated for signal flow.', techniques: ['Environment Anchoring','Context Switching Guard'], concepts: ['Context-Dependent Memory'] },
      { type: 'concentrate', name: 'Optimized', def: 'Every element actively amplifies focus.', techniques: ['Deep Work Architecture','Sensory Tuning'], concepts: ['Environmental Design'] },
    ]},
    { id: 'optimized-tools', name: 'Optimized Tools', qualities: [
      { type: 'restore', name: 'Reset', def: 'Tools returned to frictionless baseline.', techniques: ['Tool Audit Sprint','Friction Mapping'], concepts: ['Cognitive Load Theory'] },
      { type: 'maintain', name: 'Reliable', def: 'Tools perform without demanding attention.', techniques: ['Workflow Maintenance Loop','Tool Sharpening Session'], concepts: ['Automation Leverage'] },
      { type: 'concentrate', name: 'Sharp', def: 'Tools extend capability precisely where needed.', techniques: ['Deep Tool Mastery','Shortcut Saturation'], concepts: ['Extended Mind Theory'] },
    ]},
    { id: 'feedback-systems', name: 'Feedback Systems', qualities: [
      { type: 'restore', name: 'Quiet', def: 'Feedback noise silenced; SNR reset.', techniques: ['Feedback Silence Period','Metric Cleanse'], concepts: ['Signal-to-Noise Ratio'] },
      { type: 'maintain', name: 'Running', def: 'Feedback loops active and returning data.', techniques: ['Progress Pulse Check','Loop Calibration'], concepts: ['Cybernetics'] },
      { type: 'concentrate', name: 'Tuned', def: 'Feedback calibrated to exact task frequency.', techniques: ['Real-Time Signal Reading','Micro-Feedback Loop'], concepts: ['Tight Feedback Loops'] },
    ]},

    { id: 'generative-story', name: 'Generative Story', qualities: [

      { type: 'maintain', name: 'Committed', def: 'Role ownership maintained through obstacles.', techniques: ['Role Commitment Renewal','Accountability Anchor'], concepts: ['Identity-Based Habits'] },

  ]},
  spirit: { color: '#7A4DA4', states: [
    { id: 'grounding-values', name: 'Grounding Values', qualities: [
      { type: 'restore', name: 'Returned', def: 'Values re-contacted; compass reset.', techniques: ['Meaning Anchor Practice','Values Reconnection'], concepts: ['Eudaimonia'] },
      { type: 'maintain', name: 'Honored', def: 'Values expressed in daily action.', techniques: ['Values-Action Alignment','Integrity Check-In'], concepts: ['Values Clarification'] },

    { id: 'ignited-curiosity', name: 'Ignited Curiosity', qualities: [
      { type: 'restore', name: 'Reopened', def: 'Curiosity reignited after closure or fatigue.', techniques: ['Beginner Lens Reset','Wonder Injection'], concepts: ['Intrinsic Motivation'] },
      { type: 'maintain', name: 'Fed', def: 'Curiosity nourished through diverse inputs.', techniques: ['Beauty Immersion','Curiosity Queue'], concepts: ['Information Gap Theory'] },
      { type: 'concentrate', name: 'Ignited', def: 'Curiosity generates autonomous pull.', techniques: ['Deep Question Drilling','Obsession Protocol'], concepts: ['Flow Trigger: Rich Environment'] },
    ]},
    { id: 'visualized-vision', name: 'Visualized Vision', qualities: [
      { type: 'restore', name: 'Reconnected', def: 'Vision re-accessed after noise.', techniques: ['Vision Reconnection','Future Self Bridge'], concepts: ['Prospection'] },
      { type: 'maintain', name: 'Tended', def: 'Vision evolved and kept current.', techniques: ['Vision Review Ritual','Evolution Mapping'], concepts: ['Dynamic Systems Thinking'] },
      { type: 'concentrate', name: 'Crystallized', def: 'Vision sharp enough to navigate by.', techniques: ['Vision Crystallization','Precision Future-Self Protocol'], concepts: ['Mental Contrasting'] },

const TECHNIQUE_CONTENT = {
  'Pre-Session Clearance': { steps: ['Sit still 60 seconds. No input.','Write the 3 biggest emotional pulls on your attention.','For each: name it, accept it, set it aside.','Take 3 slow breaths; scan for residual tension.','State your session intention out loud.'], why: 'Clears the emotional queue so attention can fully allocate to the work. Based on Window of Tolerance research — entering a session at the edges degrades downstream performance.' },
  'Beginner Lens Reset': { steps: ["Say 'I know nothing about this' and mean it.",'List 3 things you take for granted about this domain.','For one: ask why it is true. Follow for 5 minutes.','Begin your session with fresh eyes.'], why: "Beginner's Mind (Shoshin) clears expert bias and reopens perceptual aperture. Counteracts cognitive narrowing that comes from high familiarity." },
  'Meaning Anchor Practice': { steps: ['Write: What does this work serve beyond you?','Connect to a specific person or group who benefits.','Visualize that person clearly for 30 seconds.','Begin your session with that image present.'], why: 'External meaning anchors activate transcendent motivation — shown to double persistence on difficult tasks compared to self-interest alone.' },
};

// Track which quality chip is expanded: key = "pillar/stateId/qType"
const expanded = new Set();

function toggleChip(pillar, stateId, qType) {
  const key = `${pillar}/${stateId}/${qType}`;
  if (expanded.has(key)) {
    expanded.delete(key);
  } else {
    // Close all others in the same state, open this one
    [...expanded].forEach(k => { if (k.startsWith(`${pillar}/${stateId}/`)) expanded.delete(k); });
    expanded.add(key);
  }
  render();
  // Scroll chip into view after render
  setTimeout(() => {
    const el = document.getElementById(`panel-${pillar}-${stateId}-${qType}`);
    if (el && expanded.has(key)) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function showDetail(type, name, pillar) {
  const d = DATA[pillar];
  const content = TECHNIQUE_CONTENT[name];
  document.getElementById('sheet-inner').innerHTML = `
    <button class="sheet-back" onclick="closeSheet()">‹ Back</button>
    <div class="sheet-type-badge" style="background:${rgba(pillar,0.12)};color:${d.color}">
      ${type === 'technique' ? ICONS.technique : ICONS.concept} ${type.toUpperCase()}
    </div>
    <div class="sheet-title">${name}</div>
    ${content ? `
      <div class="sheet-section-label">Why this works</div>
      <div class="sheet-content">${content.why}</div>
      <div class="sheet-section-label">Steps</div>
      <ol class="sheet-steps">
        ${content.steps.map((s,i) => `<li class="sheet-step"><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('')}
      </ol>
    ` : `<div class="sheet-content">Full content coming soon. This ${type} is in the FourFlow compendium.</div>`}
  `;
  document.getElementById('sheet-overlay').classList.add('open');
}

function closeSheet(e) {
  if (!e || e.target === document.getElementById('sheet-overlay')) {
    document.getElementById('sheet-overlay').classList.remove('open');
  }
}

function render() {
  const area = document.getElementById('scroll-area');
  area.innerHTML = Object.entries(DATA).map(([pillar, d]) => {
    const color = d.color;
    const states = d.states.map(state => {
      const chips = state.qualities.map(q => {
        const key = `${pillar}/${state.id}/${q.type}`;
        const isActive = expanded.has(key);
        return `
          <div class="q-chip ${isActive ? 'active' : ''}"
               style="${isActive ? `border-color:${rgba(pillar,0.35)};background:${rgba(pillar,0.06)}` : ''}"
               onclick="toggleChip('${pillar}','${state.id}','${q.type}')">
            <div class="q-chip-type">
              <span class="q-chip-icon" style="color:${isActive ? color : '#aaa'}">${ICONS[q.type]}</span>
              <span class="q-chip-type-label">${q.type}</span>
            </div>
            <div class="q-chip-name" style="color:${isActive ? color : '#555'}">${q.name}</div>
          </div>
        `;
      }).join('');

      const panels = state.qualities.map(q => {
        const key = `${pillar}/${state.id}/${q.type}`;
        const isOpen = expanded.has(key);
        const techItems = q.techniques.map(t => `
          <button class="ep-item" onclick="showDetail('technique','${t}','${pillar}')">
            <div class="ep-item-icon" style="background:${rgba(pillar,0.10)};color:${color}">${ICONS.technique}</div>
            <span class="ep-item-name">${t}</span>
            <span class="ep-item-arrow">›</span>
          </button>
        `).join('');
        const conceptItems = q.concepts.map(c => `
          <button class="ep-item" onclick="showDetail('concept','${c}','${pillar}')">
            <div class="ep-item-icon" style="background:${rgba(pillar,0.10)};color:${color}">${ICONS.concept}</div>
            <span class="ep-item-name">${c}</span>
            <span class="ep-item-arrow">›</span>
          </button>
        `).join('');

        return `
          <div class="expansion-panel ${isOpen ? 'open' : ''}" id="panel-${pillar}-${state.id}-${q.type}">
            <div class="expansion-inner">
              <div class="ep-header">
                <div class="ep-icon" style="background:${rgba(pillar,0.10)};color:${color}">${ICONS[q.type]}</div>
                <div class="ep-info">
                  <div class="ep-type" style="color:${color}">${ICONS[q.type]} ${q.type.toUpperCase()} QUALITY</div>
                  <div class="ep-name">${q.name}</div>
                  <div class="ep-def">${q.def}</div>
                </div>
              </div>
              <div class="ep-section-label" style="border-color:${rgba(pillar,0.08)}">${ICONS.technique} Techniques</div>
              ${techItems}
              <div class="ep-section-label" style="border-color:${rgba(pillar,0.08)}">${ICONS.concept} Concepts</div>
              ${conceptItems}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="state-row">
          <div class="state-row-header">
            <span class="state-emoji">${STATE_EMOJIS[state.id] || '●'}</span>
            <span class="state-name" style="color:${color}">${state.name}</span>
          </div>
          <div class="quality-chips">${chips}</div>
          ${panels}
        </div>
      `;
    }).join('');

    return `
      <div class="dim-section">
        <div class="dim-header">
          <div class="dim-accent-bar" style="background:${color}"></div>
          <span class="dim-emoji">${DIM_EMOJIS[pillar]}</span>
          <span class="dim-name" style="color:${color}">${pillar}</span>
          <span class="dim-count">3 states</span>
        </div>
        ${states}
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
