<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowCompendium — Faithful</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --self:    #E8604A;
  --space:   #6BA292;
  --story:   #5B84B1;
  --spirit:  #7A4DA4;
  --bg:      #0a0a0a;
  --inactive-bg: #1E1815;
  --inactive-border: rgba(255,255,255,0.06);
  --text:    #F0EDE8;
  --muted:   rgba(255,255,255,0.38);
  --card-bg: #F5F2EE;
}

html, body { background: #111; font-family: 'Inter', system-ui, sans-serif; }

/* ── Mockup label ── */
.mockup-label {
  text-align: center; padding: 20px 0 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.22);
}

/* ── Phone shell ── */
.phone {
  width: 390px; height: 844px;
  margin: 0 auto 40px;
  background: var(--bg);
  border-radius: 50px;
  overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.07);
  display: flex; flex-direction: column;
  position: relative;
}

/* ── Status bar ── */
.status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px 0;
  height: 44px;
  flex-shrink: 0;
  color: rgba(255,255,255,0.85);
  font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  position: relative; z-index: 10;
}
.status-right { display: flex; align-items: center; gap: 6px; }

/* ── Nav bar ── */
.navbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 20px 10px;
  flex-shrink: 0;
}
.nav-logo {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(135deg, #E8604A 0%, #c44a34 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 2px 12px rgba(232,96,74,0.4);
}
.nav-menu {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.nav-menu svg { width: 16px; height: 16px; }

/* ── Header ── */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 20px 16px;
  flex-shrink: 0;
}
.header-icon {
  width: 38px; height: 38px; border-radius: 12px;
  background: rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.header-text {}
.header-title {
  font-size: 17px; font-weight: 800;
  color: var(--text); letter-spacing: -0.01em;
}
.header-sub {
  font-size: 11px; color: var(--muted);
  margin-top: 1px; font-weight: 500;
}

/* ── Filter rows ── */
.filters { padding: 0 16px; flex-shrink: 0; }

/* Row 1: Dimensions */
.dim-row {
  display: flex; gap: 6px; margin-bottom: 7px;
}
.dim-pill {
  flex: 1; height: 40px;
  border-radius: 12px;
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  border: none; cursor: pointer;
  transition: all 0.18s ease;
  color: rgba(255,255,255,0.35);
  background: var(--inactive-bg);
  border: 1px solid var(--inactive-border);
}
.dim-pill.active {
  color: #fff;
  border-color: transparent;
}

/* Row 2: States */
.state-row {
  display: flex; gap: 6px; margin-bottom: 7px;
}
.state-pill {
  flex: 1; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  gap: 7px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.01em;
  border: none; cursor: pointer;
  transition: all 0.18s ease;
  color: rgba(255,255,255,0.30);
  background: var(--inactive-bg);
  border: 1px solid var(--inactive-border);
  padding: 0 10px;
}
.state-pill.active {
  color: #fff;
  border-color: transparent;
}
.state-pill-icon {
  width: 22px; height: 22px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  opacity: 0.5;
}
.state-pill.active .state-pill-icon { opacity: 1; }
.state-pill-name {
  font-size: 11px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-align: left;
}

/* Row 3: Qualities */
.quality-row {
  display: flex; gap: 6px; margin-bottom: 7px;
}
.quality-pill {
  flex: 1; height: 38px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  border: none; cursor: pointer;
  transition: all 0.18s ease;
  color: rgba(255,255,255,0.28);
  background: var(--inactive-bg);
  border: 1px solid var(--inactive-border);
}
.quality-pill.active {
  color: #fff;
  border-color: transparent;
}
.quality-icon {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; opacity: 0.6;
}
.quality-pill.active .quality-icon { opacity: 1; }
.quality-icon svg { width: 14px; height: 14px; display: block; }

/* Row 4: Description bar */
.desc-bar {
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 12px; font-weight: 600;
  line-height: 1.4;
  margin-bottom: 12px;
  color: rgba(255,255,255,0.92);
  transition: background 0.2s;
}

/* ── Content card ── */
.content-card {
  flex: 1;
  background: var(--card-bg);
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  display: flex; flex-direction: column;
  margin: 0;
  min-height: 0;
}

/* Tab toggle */
.tab-toggle {
  display: flex; margin: 14px 16px 10px;
  background: rgba(0,0,0,0.08);
  border-radius: 12px; padding: 3px;
  gap: 3px; flex-shrink: 0;
}
.tab-btn {
  flex: 1; height: 34px; border-radius: 10px;
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.10em; text-transform: uppercase;
  border: none; cursor: pointer; transition: all 0.18s;
  color: rgba(0,0,0,0.35);
  background: transparent;
}
.tab-btn.active {
  background: #1A1A1A;
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

/* Item display */
.item-area {
  flex: 1; padding: 0 56px; /* leave space for arrows */
  display: flex; flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
  min-height: 0;
  position: relative;
}
.item-inner {
  padding: 4px 0 16px;
}
.item-type-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.item-title {
  font-size: 19px; font-weight: 800;
  line-height: 1.2; margin-bottom: 10px;
  letter-spacing: -0.02em;
}
.item-body {
  font-size: 13px; line-height: 1.6;
  color: #3A3530;
  margin-bottom: 14px;
}
.item-tag {
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
}

/* Item counter */
.item-counter {
  text-align: center; flex-shrink: 0;
  font-size: 10px; font-weight: 600;
  color: rgba(0,0,0,0.25); letter-spacing: 0.08em;
  padding-bottom: 16px;
}

/* Arrow buttons */
.arrow-btn {
  position: absolute; top: 50%; transform: translateY(-60%);
  width: 40px; height: 40px;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--self);
  font-size: 32px; font-weight: 300;
  transition: opacity 0.15s;
  line-height: 1;
}
.arrow-btn:hover { opacity: 0.7; }
.arrow-btn.left { left: 8px; }
.arrow-btn.right { right: 8px; }
.arrow-btn.disabled { opacity: 0.15; pointer-events: none; }
</style>
</head>

// ── State ──
let activePillar = 'self';
let activeStateIndex = 0;
let activeQualityIndex = 0;
let activeTab = 'techniques';
let activeItemIndex = 0;

function color() { return DATA[activePillar].color; }
function states() { return DATA[activePillar].states; }
function activeState() { return states()[activeStateIndex]; }
function activeQuality() { return activeState().qualities[activeQualityIndex]; }
function items() { return activeTab === 'techniques' ? activeQuality().techniques : activeQuality().concepts; }

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Render ──
function render() {
  const c = color();
  const h = hexToRgba(c, 1);

  // Row 1: Dimensions
  document.getElementById('dim-row').innerHTML = Object.keys(DATA).map(p => `
    <button class="dim-pill ${p === activePillar ? 'active' : ''}"
      style="${p === activePillar ? `background:${DATA[p].color};` : ''}"
      onclick="selectPillar('${p}')">${p.toUpperCase()}</button>
  `).join('');

  // Row 2: States
  document.getElementById('state-row').innerHTML = states().map((s, i) => `
    <button class="state-pill ${i === activeStateIndex ? 'active' : ''}"
      style="${i === activeStateIndex ? `background:${hexToRgba(c, 0.85)};` : ''}"
      onclick="selectState(${i})">
      <span class="state-pill-icon">${STATE_EMOJIS[s.id] || '●'}</span>
      <span class="state-pill-name">${s.name}</span>
    </button>
  `).join('');

  // Row 3: Qualities
  document.getElementById('quality-row').innerHTML = activeState().qualities.map((q, i) => `
    <button class="quality-pill ${i === activeQualityIndex ? 'active' : ''}"
      style="${i === activeQualityIndex ? `background:${hexToRgba(c, 0.8)};` : ''}"
      onclick="selectQuality(${i})">
      <span class="quality-icon">${ICONS[q.type]}</span>
      ${q.name.toUpperCase()}
    </button>
  `).join('');

  // Row 4: Description
  const descEl = document.getElementById('desc-bar');
  descEl.textContent = activeQuality().desc;
  descEl.style.background = hexToRgba(c, 0.85);

  // Tabs
  document.getElementById('tab-techniques').classList.toggle('active', activeTab === 'techniques');
  document.getElementById('tab-concepts').classList.toggle('active', activeTab === 'concepts');

  // Item
  const itemList = items();
  const clampedIndex = Math.min(activeItemIndex, itemList.length - 1);
  if (clampedIndex !== activeItemIndex) activeItemIndex = clampedIndex;

  if (itemList.length === 0) {
    document.getElementById('item-inner').innerHTML = `<p style="color:#aaa;font-size:13px;padding-top:20px">No ${activeTab} for this quality yet.</p>`;
    document.getElementById('item-counter').textContent = '';
    document.getElementById('arrow-left').classList.add('disabled');
    document.getElementById('arrow-right').classList.add('disabled');
  } else {
    const item = itemList[activeItemIndex];
    document.getElementById('item-inner').innerHTML = `
      <div class="item-type-label" style="color:${c}">${item.type.toUpperCase()}</div>
      <div class="item-title" style="color:${c}">${item.name}</div>
      <div class="item-body">${item.body}</div>
    `;
    document.getElementById('item-counter').textContent = `${activeItemIndex + 1} of ${itemList.length}`;
    document.getElementById('arrow-left').classList.toggle('disabled', activeItemIndex === 0);
    document.getElementById('arrow-right').classList.toggle('disabled', activeItemIndex === itemList.length - 1);
  }

  // Arrow color
  document.querySelectorAll('.arrow-btn').forEach(b => b.style.color = c);
}

function selectPillar(p) {
  activePillar = p;
  activeStateIndex = 0;
  activeQualityIndex = 0;
  activeItemIndex = 0;
  render();
}
function selectState(i) {
  activeStateIndex = i;
  activeQualityIndex = 0;
  activeItemIndex = 0;
  render();
}
function selectQuality(i) {
  activeQualityIndex = i;
  activeItemIndex = 0;
  render();
}
function switchTab(t) {
  activeTab = t;
  activeItemIndex = 0;
  render();
}
function prevItem() {
  if (activeItemIndex > 0) { activeItemIndex--; render(); }
}
function nextItem() {
  if (activeItemIndex < items().length - 1) { activeItemIndex++; render(); }
}

render();
</script>
