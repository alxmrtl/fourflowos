<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup A — Signal Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --self:    #FF6F61;
  --space:   #6BA292;
  --story:   #5B84B1;
  --spirit:  #7A4DA4;
  --bg:      #F7F6F3;
  --surface: #FFFFFF;
  --text:    #1A1A1A;
  --muted:   #888888;
  --dim:     #CCCCCC;
  --border:  rgba(0,0,0,0.07);
}

html, body { width: 100%; height: 100%; background: #E8E6E0; font-family: 'Inter', system-ui, sans-serif; }

/* ── Phone shell ── */
.phone-shell {
  width: 390px; min-height: 844px;
  margin: 32px auto;
  background: var(--bg);
  border-radius: 48px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.10);
  overflow: hidden;
  position: relative;
}

/* ── Label ── */
.mockup-label {
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(0,0,0,0.35);
  margin-bottom: 10px;
}

/* ── Status bar ── */
.status-bar {
  height: 44px; padding: 14px 28px 0;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 600;
  background: var(--bg);
}
.status-time { font-variant-numeric: tabular-nums; }
.status-icons { display: flex; gap: 5px; align-items: center; }

/* ── Header ── */
.page-header {
  padding: 10px 24px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.page-title {
  font-size: 22px; font-weight: 800;
  letter-spacing: -0.02em;
}
.page-count { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ── Dimension tab bar ── */
.tab-bar {
  display: flex; gap: 6px;
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
}
.dim-tab {
  flex: 1; height: 36px;
  border-radius: 10px; border: 1.5px solid transparent;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  color: var(--muted);
  background: var(--surface);
  border-color: var(--border);
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex; align-items: center; justify-content: center;
}
.dim-tab.active[data-pillar="self"]   { background: var(--self);   color: #fff; border-color: var(--self); }
.dim-tab.active[data-pillar="space"]  { background: var(--space);  color: #fff; border-color: var(--space); }
.dim-tab.active[data-pillar="story"]  { background: var(--story);  color: #fff; border-color: var(--story); }
.dim-tab.active[data-pillar="spirit"] { background: var(--spirit); color: #fff; border-color: var(--spirit); }

/* ── Scroll area ── */
.scroll-area {
  padding: 4px 16px 100px;
  overflow-y: auto;
  max-height: calc(844px - 44px - 52px - 50px);
}

/* ── State card ── */
.state-card {
  background: var(--surface);
  border-radius: 20px;
  margin-bottom: 12px;
  overflow: hidden;
  border: 1.5px solid var(--border);
  transition: box-shadow 0.18s;
}
.state-card.open { box-shadow: 0 8px 28px rgba(0,0,0,0.08); }

.state-card-header {
  display: flex; flex-direction: column;
  cursor: pointer;
  padding: 16px 16px 0;
}
.state-card-top {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.state-icon-circle {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.state-name-wrap { flex: 1; }
.state-name {
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.state-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.state-chevron {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.05);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--muted);
  transition: transform 0.2s, background 0.2s;
  flex-shrink: 0;
}
.state-card.open .state-chevron { transform: rotate(180deg); }

/* ── Quality strip (bottom of header) ── */
.quality-strip {
  display: flex; border-top: 1px solid var(--border);
  margin: 0 -0px;
}
.q-strip-col {
  flex: 1; padding: 10px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  position: relative;
}
.q-strip-col + .q-strip-col { border-left: 1px solid var(--border); }
.q-type-row {
  display: flex; align-items: center; gap: 3px;
}
.q-type-icon { width: 10px; height: 10px; display: flex; align-items: center; justify-content: center; }
.q-type-icon svg { width: 10px; height: 10px; display: block; }
.q-type-label {
  font-size: 7px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--muted);
  white-space: nowrap;
}
.q-name {
  font-size: 10px; font-weight: 700;
  text-align: center; line-height: 1.2;
  white-space: nowrap;
}

/* ── Expanded quality rows ── */
.quality-rows {
  display: none; border-top: 1px solid var(--border);
}
.state-card.open .quality-rows { display: block; }

.quality-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}
.quality-row:last-child { border-bottom: none; }
.quality-row:hover { background: rgba(0,0,0,0.02); }
.quality-row:active { background: rgba(0,0,0,0.04); }

.qr-icon-wrap {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.qr-icon-wrap svg { width: 14px; height: 14px; }

.qr-content { flex: 1; }
.qr-type-row {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 2px;
}
.qr-type-badge {
  display: flex; align-items: center; gap: 3px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase; opacity: 0.55;
}
.qr-type-badge svg { width: 9px; height: 9px; }
.qr-name {
  font-size: 13px; font-weight: 700;
  line-height: 1.2; margin-bottom: 2px;
}
.qr-def {
  font-size: 11px; color: var(--muted);
  line-height: 1.4;
}
.qr-count {
  font-size: 10px; color: var(--muted); margin-top: 4px;
  display: flex; gap: 8px; align-items: center;
}
.qr-count span { display: flex; align-items: center; gap: 3px; }
.qr-arrow {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(0,0,0,0.04);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; align-self: center;
  font-size: 10px; color: var(--muted);
}

/* ── Bottom sheet overlay ── */
.sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 100;
  display: none; align-items: flex-end;
  backdrop-filter: blur(2px);
}
.sheet-overlay.open { display: flex; }

.bottom-sheet {
  width: 100%; max-height: 70vh;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--dim);
  margin: 10px auto 0;
  flex-shrink: 0;
}

.sheet-header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sheet-back {
  font-size: 11px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 4px;
  cursor: pointer; margin-bottom: 8px;
  background: none; border: none; padding: 0;
}
.sheet-breadcrumb {
  font-size: 10px; color: var(--muted); font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 4px;
}
.sheet-title {
  font-size: 17px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
}
.sheet-type-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 3px 7px; border-radius: 6px;
}

.sheet-list {
  overflow-y: auto; flex: 1;
  padding: 8px 0;
}
.sheet-section-label {
  padding: 8px 20px 4px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
}
.sheet-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 20px;
  cursor: pointer;
  transition: background 0.12s;
  border-none;
  background: none; border: none; width: 100%; text-align: left;
}
.sheet-item:hover { background: rgba(0,0,0,0.03); }
.sheet-item:active { background: rgba(0,0,0,0.06); }
.sheet-item-icon {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sheet-item-icon svg { width: 13px; height: 13px; }
.sheet-item-text { flex: 1; text-align: left; }
.sheet-item-name { font-size: 13px; font-weight: 600; }
.sheet-item-type { font-size: 10px; color: var(--muted); margin-top: 1px; }
.sheet-item-arrow { font-size: 11px; color: var(--dim); }

/* ── Detail sheet ── */
.detail-sheet {
  width: 100%; max-height: 75vh;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}
.detail-header {
  padding: 14px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.detail-breadcrumb { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.detail-type-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 8px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase;
  margin-bottom: 10px;
}
.detail-title { font-size: 20px; font-weight: 800; line-height: 1.2; }
.detail-body {
  padding: 18px 20px; overflow-y: auto; flex: 1;
}
.detail-section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.detail-content { font-size: 13px; line-height: 1.6; color: #333; margin-bottom: 20px; }
.detail-steps { padding-left: 0; list-style: none; }
.detail-step {
  display: flex; gap: 10px; margin-bottom: 10px;
  font-size: 13px; line-height: 1.5; color: #333;
}
.step-num {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.07);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
</style>
</head>

      { type: 'concentrate', name: 'Owned', def: 'Full authorship of role; zero victim orientation, pure agency.', techniques: ['Creator vs Reactor Practice','Agency Affirmation'], concepts: ['Locus of Control'] },
    ]},
  ]},
  spirit: { color: '#7A4DA4', states: [
    { id: 'grounding-values', name: 'Grounding Values', qualities: [
      { type: 'restore', name: 'Returned', def: 'Values re-contacted after drift; moral compass fully reset.', techniques: ['Meaning Anchor Practice','Values Reconnection'], concepts: ['Eudaimonia'] },
      { type: 'maintain', name: 'Honored', def: 'Values actively expressed in daily action and every decision.', techniques: ['Values-Action Alignment','Integrity Check-In'], concepts: ['Values Clarification'] },
      { type: 'concentrate', name: 'Embodied', def: 'Values fully integrated; right action flows from them automatically.', techniques: ['Living Values Protocol','Value Compression'], concepts: ['Character Virtues'] },
    ]},
    { id: 'ignited-curiosity', name: 'Ignited Curiosity', qualities: [
      { type: 'restore', name: 'Reopened', def: 'Curiosity reignited after closure, boredom, or creative fatigue.', techniques: ['Beginner Lens Reset','Wonder Injection'], concepts: ['Intrinsic Motivation'] },
      { type: 'maintain', name: 'Fed', def: 'Curiosity continuously nourished through diverse and unexpected inputs.', techniques: ['Beauty Immersion','Curiosity Queue'], concepts: ['Information Gap Theory'] },
      { type: 'concentrate', name: 'Ignited', def: 'Curiosity so activated it generates autonomous forward pull.', techniques: ['Deep Question Drilling','Obsession Protocol'], concepts: ['Flow Trigger: Rich Environment'] },
    ]},
    { id: 'visualized-vision', name: 'Visualized Vision', qualities: [
      { type: 'restore', name: 'Reconnected', def: 'Vision re-accessed after noise, disconnection, or a difficult season.', techniques: ['Vision Reconnection','Future Self Bridge'], concepts: ['Prospection'] },
      { type: 'maintain', name: 'Tended', def: 'Vision actively evolved and kept current with personal growth.', techniques: ['Vision Review Ritual','Evolution Mapping'], concepts: ['Dynamic Systems Thinking'] },
      { type: 'concentrate', name: 'Crystallized', def: 'Vision so sharp and precise it functions as a navigation instrument.', techniques: ['Vision Crystallization','Precision Future-Self Protocol'], concepts: ['Mental Contrasting'] },
    ]},
  ]},
};

const TECHNIQUE_CONTENT = {
  'Pre-Session Clearance': { steps: ['Sit still for 60 seconds. No input.','Write down the 3 biggest emotional pulls on your attention right now.','For each one: name the feeling, accept it is there, and set it aside deliberately.','Take 3 slow breaths. Scan the body for residual tension.','State your session intention out loud.'], why: 'Clears the emotional queue so attention can fully allocate to the work. Based on Window of Tolerance research — entering a session already at the edges degrades all downstream performance.' },
  'Somatic Release Protocol': { steps: ['Find a private space. Stand up.','Shake both hands rapidly for 30 seconds.','Roll shoulders back 5 times, then forward 5 times.','Take a single full exhale — longer than any inhale.','Notice any spot in the body still holding. Breathe directly into it.'], why: 'Physiological movement discharges stored emotional charge faster than cognitive processing. Especially effective before creative or high-stakes work.' },
  'Beginner Lens Reset': { steps: ["Say 'I know nothing about this' and mean it — even for familiar work.",'List 3 things you take for granted about this domain.','For one of them: ask why it is true. Follow the question for 5 minutes.','Begin your session with fresh eyes.'], why: "Beginner's Mind (Shoshin) clears expert bias and reopens perceptual aperture. Counteracts the cognitive narrowing that comes from high familiarity." },
  'Meaning Anchor Practice': { steps: ['Write down: What does this work serve beyond you?','Connect that answer to a specific person or group who benefits.','Visualize that person clearly for 30 seconds.','Begin your session with that image still present.'], why: 'External meaning anchors activate transcendent motivation — shown to double persistence on difficult tasks compared to self-interest alone.' },
};

let activePillar = 'self';
let openStateId = null;
let currentSheetData = null;

function hex(p) { return COLORS[p]; }
function rgba(p, a) {
  const h = COLORS[p]; const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function switchTab(pillar) {
  activePillar = pillar;
  openStateId = null;
  document.querySelectorAll('.dim-tab').forEach(t => t.classList.toggle('active', t.dataset.pillar === pillar));
  renderStates();
}

function toggleState(stateId) {
  openStateId = openStateId === stateId ? null : stateId;
  renderStates();
}

function renderStates() {
  const d = DATA[activePillar];
  const color = d.color;
  const area = document.getElementById('scroll-area');

  area.innerHTML = d.states.map(state => {
    const isOpen = openStateId === state.id;
    const emoji = EMOJIS[state.id] || '●';

    const qualityStrip = state.qualities.map(q => `
      <div class="q-strip-col">
        <div class="q-type-row">
          <span class="q-type-icon" style="color:${color}">${ICONS[q.type]}</span>
          <span class="q-type-label">${q.type}</span>
        </div>
        <div class="q-name" style="color:${color}">${q.name}</div>
      </div>
    `).join('');

    const qualityRows = state.qualities.map(q => `
      <div class="quality-row" onclick="openSheet('${state.id}', '${q.type}', '${q.name}')">
        <div class="qr-icon-wrap" style="background:${rgba(activePillar,0.10)}">
          <span style="color:${color}">${ICONS[q.type]}</span>
        </div>
        <div class="qr-content">
          <div class="qr-type-badge" style="color:${color}">
            ${ICONS[q.type]} ${q.type.toUpperCase()}
          </div>
          <div class="qr-name">${q.name}</div>
          <div class="qr-def">${q.def}</div>
          <div class="qr-count">
            <span>${ICONS.technique} ${q.techniques.length} techniques</span>
            <span>${ICONS.concept} ${q.concepts.length} concepts</span>
          </div>
        </div>
        <div class="qr-arrow">›</div>
      </div>
    `).join('');

    return `
      <div class="state-card ${isOpen ? 'open' : ''}" id="sc-${state.id}">
        <div class="state-card-header" onclick="toggleState('${state.id}')">
          <div class="state-card-top">
            <div class="state-icon-circle" style="background:${rgba(activePillar,0.10)};font-size:20px">${emoji}</div>
            <div class="state-name-wrap">
              <div class="state-name" style="color:${color}">${state.name}</div>
              <div class="state-sub">${state.qualities.length} qualities · ${state.qualities.reduce((s,q)=>s+q.techniques.length,0)} techniques</div>
            </div>
            <div class="state-chevron" style="background:${rgba(activePillar,0.08)}">▾</div>
          </div>
          <div class="quality-strip" style="border-color:${rgba(activePillar,0.10)}">
            ${qualityStrip}
          </div>
        </div>
        <div class="quality-rows">${qualityRows}</div>
      </div>
    `;
  }).join('');
}

function openSheet(stateId, qType, qName) {
  const state = DATA[activePillar].states.find(s => s.id === stateId);
  const quality = state.qualities.find(q => q.type === qType);
  const color = COLORS[activePillar];

  currentSheetData = { state, quality, color };

  document.getElementById('sheet-header').innerHTML = `
    <div class="sheet-back" onclick="closeSheet()">‹ ${state.name}</div>
    <div class="sheet-breadcrumb">${activePillar.toUpperCase()} · ${state.name}</div>
    <div class="sheet-title">
      <span style="color:${color}">${ICONS[qType]}</span>
      ${qName}
      <span style="font-size:12px;color:#888;font-weight:500">${qType}</span>
    </div>
  `;

  document.getElementById('sheet-list').innerHTML = `
    <div class="sheet-section-label">Techniques</div>
    ${quality.techniques.map(t => `
      <button class="sheet-item" onclick="openDetail('technique','${t}','${stateId}','${qType}')">
        <div class="sheet-item-icon" style="background:${rgba(activePillar,0.10)};color:${color}">${ICONS.technique}</div>
        <div class="sheet-item-text">
          <div class="sheet-item-name">${t}</div>
          <div class="sheet-item-type">Technique</div>
        </div>
        <span class="sheet-item-arrow">›</span>
      </button>
    `).join('')}
    <div class="sheet-section-label">Concepts</div>
    ${quality.concepts.map(c => `
      <button class="sheet-item" onclick="openDetail('concept','${c}','${stateId}','${qType}')">
        <div class="sheet-item-icon" style="background:${rgba(activePillar,0.10)};color:${color}">${ICONS.concept}</div>
        <div class="sheet-item-text">
          <div class="sheet-item-name">${c}</div>
          <div class="sheet-item-type">Concept</div>
        </div>
        <span class="sheet-item-arrow">›</span>
      </button>
    `).join('')}
  `;

  document.getElementById('sheet-overlay').classList.add('open');
}

function openDetail(type, name, stateId, qType) {
  const state = DATA[activePillar].states.find(s => s.id === stateId);
  const color = COLORS[activePillar];
  const content = TECHNIQUE_CONTENT[name];

  document.getElementById('detail-header').innerHTML = `
    <div class="sheet-back" onclick="closeDetail()">‹ ${state.qualities.find(q=>q.type===qType)?.name || 'Back'}</div>
    <div class="detail-breadcrumb">${state.name} · ${qType}</div>
    <div class="detail-type-badge" style="background:${rgba(activePillar,0.10)};color:${color}">
      ${type === 'technique' ? ICONS.technique : ICONS.concept} ${type.toUpperCase()}
    </div>
    <div class="detail-title">${name}</div>
  `;

  document.getElementById('detail-body').innerHTML = content ? `
    <div class="detail-section-label">Why this works</div>
    <div class="detail-content">${content.why}</div>
    <div class="detail-section-label">Steps</div>
    <ol class="detail-steps">
      ${content.steps.map((s,i) => `<li class="detail-step"><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('')}
    </ol>
  ` : `
    <div class="detail-content" style="color:#888">Full content coming soon. This ${type} is part of the ${state.name} state in the ${activePillar.toUpperCase()} dimension.</div>
  `;

  document.getElementById('detail-overlay').classList.add('open');
}

function closeSheet(e) {
  if (!e || e.target === document.getElementById('sheet-overlay')) {
    document.getElementById('sheet-overlay').classList.remove('open');
  }
}

function closeDetail(e) {
  if (!e || e.target === document.getElementById('detail-overlay')) {
    document.getElementById('detail-overlay').classList.remove('open');
  }
}

// Init
renderStates();
</script>
</body>
</html>
